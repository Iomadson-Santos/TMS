<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TMS · Registro</title>
  <script src="tms.js"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: var(--bg);
      font-family: var(--body);
      color: var(--text);
    }
    .register-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .register-header {
      text-align: center;
      margin-bottom: 25px;
    }
    .register-logo {
      font-family: var(--display);
      font-size: 28px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .register-logo .dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .register-subtitle {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--red);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: var(--green);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .register-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text2);
    }
    .register-footer a {
      color: var(--accent);
      font-weight: 600;
    }
    .register-footer a:hover {
      text-decoration: underline;
    }
    .btn-block {
      width: 100%;
      justify-content: center;
      padding: 12px;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="register-card">
  <div class="register-header">
    <div class="register-logo"><div class="dot"></div>TMS</div>
    <div class="register-subtitle">Criar Nova Conta</div>
  </div>

  <div id="errorBox" class="error-message"></div>
  <div id="successBox" class="success-message"></div>

  <form id="registerForm">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Usuário</label>
        <input type="text" id="username" class="form-input" placeholder="ex: joao_silva" required>
      </div>
      <div class="form-group">
        <label class="form-label">Cargo (Role)</label>
        <select id="role" class="form-select" required>
          <option value="operador">Operador</option>
          <option value="motorista">Motorista</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input type="email" id="email" class="form-input" placeholder="seu@email.com" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label class="form-label">Confirmar Senha</label>
        <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Cadastrar Conta</button>
  </form>

  <div class="register-footer">
    Já tem uma conta? <a href="login.html">Faça login</a>
  </div>
</div>

<script>
  TMS.initLayout('register');
  
  // Remove elementos de layout
  const sidebar = document.querySelector('.sidebar');
  const mainWrap = document.querySelector('.main-wrap');
  if (sidebar) sidebar.remove();
  if (mainWrap) {
    const content = mainWrap.children;
    while(mainWrap.firstChild) {
      document.body.appendChild(mainWrap.firstChild);
    }
    mainWrap.remove();
  }

  const registerForm = document.getElementById('registerForm');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const registerBtn = document.getElementById('registerBtn');

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const role = document.getElementById('role').value;

    if (password !== confirmPassword) {
      errorBox.textContent = 'As senhas não coincidem.';
      errorBox.style.display = 'block';
      return;
    }

    registerBtn.disabled = true;
    registerBtn.textContent = 'Processando...';

    try {
      const response = await fetch(`${TMS.API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password, role })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.detail || 'Erro ao criar conta.');
      }

      successBox.textContent = 'Conta criada com sucesso! Redirecionando...';
      successBox.style.display = 'block';
      
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);

    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      registerBtn.disabled = false;
      registerBtn.textContent = 'Cadastrar Conta';
    }
  });
</script>

</body>
</html>
