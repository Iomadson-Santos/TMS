<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TMS · Cadastro</title>
  <script src="tms.js"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      font-family: var(--body);
      color: var(--text);
      padding: 20px;
    }

    .register-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .register-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .register-logo {
      font-family: var(--display);
      font-size: 32px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .register-logo .dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: var(--accent);
      box-shadow: 0 0 15px var(--accent);
    }

    .register-subtitle {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .message {
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .message-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--red);
    }

    .message-success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: var(--green);
    }

    .btn-block {
      width: 100%;
      justify-content: center;
      padding: 12px;
      font-size: 14px;
      margin-top: 10px;
    }

    .register-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text2);
    }

    .register-footer a {
      color: var(--accent);
      font-weight: 600;
    }

    .register-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="register-card">
  <div class="register-header">
    <div class="register-logo">
      <div class="dot"></div>
      TMS
    </div>
    <div class="register-subtitle">Criar Conta</div>
  </div>

  <div id="messageBox" class="message"></div>

  <form id="registerForm">
    <div class="form-group">
      <label class="form-label">Nome</label>
      <input
        type="text"
        id="nome"
        class="form-input"
        placeholder="Nome completo"
        required
        autofocus
      >
    </div>

    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input
        type="email"
        id="email"
        class="form-input"
        placeholder="usuario@tms.com"
        required
      >
    </div>

    <div class="form-group">
      <label class="form-label">Senha</label>
      <input
        type="password"
        id="password"
        class="form-input"
        placeholder="Mínimo recomendado: 6 caracteres"
        required
      >
    </div>

    <div class="form-group">
      <label class="form-label">Perfil</label>
      <select id="role" class="form-select" required>
        <option value="operador">Operador</option>
        <option value="motorista">Motorista</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
      Criar Conta
    </button>
  </form>

  <div class="register-footer">
    Já tem uma conta? <a href="login.html">Entrar</a>
  </div>
</div>

<script>
  TMS.initLayout('register');

  const registerForm = document.getElementById('registerForm');
  const messageBox = document.getElementById('messageBox');
  const registerBtn = document.getElementById('registerBtn');

  function showMessage(type, text) {
    messageBox.textContent = text;
    messageBox.className = `message message-${type}`;
    messageBox.style.display = 'block';
  }

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    messageBox.style.display = 'none';
    messageBox.textContent = '';

    registerBtn.disabled = true;
    registerBtn.textContent = 'Criando conta...';

    const payload = {
      nome: document.getElementById('nome').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
      role: document.getElementById('role').value,
    };

    try {
      await TMS.register(payload);

      showMessage('success', 'Conta criada com sucesso. Redirecionando para o login...');

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1200);
    } catch (err) {
      showMessage('error', err.message || 'Erro ao criar conta.');

      registerBtn.disabled = false;
      registerBtn.textContent = 'Criar Conta';
    }
  });
</script>

</body>
</html>
