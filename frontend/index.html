<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TMS · Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="tms.js"></script>
</head>
<body>

<div class="topbar">
  <div>
    <span class="topbar-title">Dashboard</span>
    <span class="topbar-breadcrumb">/ visão geral</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-time" id="clock"></span>
  </div>
</div>

<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Visão Geral da Frota</div>
      <div class="page-sub" id="pageDate">Carregando...</div>
    </div>
    <button class="btn btn-primary" onclick="window.location='vehicles.html'">+ Novo Veículo</button>
  </div>

  <div class="grid-4" style="margin-bottom:20px">
    <div class="card"><div class="card-title">Total Veículos</div><div class="kpi-value" id="kTotal">—</div><div class="kpi-sub">na frota</div></div>
    <div class="card"><div class="card-title">Em Rota</div><div class="kpi-value" style="color:var(--accent)" id="kRota">—</div><div class="kpi-sub">ativos agora</div></div>
    <div class="card"><div class="card-title">Disponíveis</div><div class="kpi-value" style="color:var(--green)" id="kDisp">—</div><div class="kpi-sub">prontos para operar</div></div>
    <div class="card"><div class="card-title">Rotas Hoje</div><div class="kpi-value" style="color:var(--yellow)" id="kRotasHoje">—</div><div class="kpi-sub">criadas hoje</div></div>
  </div>

  <div class="grid-2" style="margin-bottom:20px">
    <div class="card">
      <div class="card-title">Status da Frota</div>
      <div style="height:200px;display:flex;align-items:center;justify-content:center">
        <canvas id="chartFrota"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Rotas por Status</div>
      <div style="height:200px;display:flex;align-items:center;justify-content:center">
        <canvas id="chartRotas"></canvas>
      </div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="card-title" style="margin:0">Rotas Recentes</div>
        <a href="routes.html" style="font-size:11px;color:var(--accent);font-family:var(--mono)">ver todas →</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Nome</th><th>Status</th><th>Dist.</th><th>Paradas</th></tr>
          </thead>
          <tbody id="recentRoutes"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="card-title" style="margin:0">Frota</div>
        <a href="vehicles.html" style="font-size:11px;color:var(--accent);font-family:var(--mono)">ver todos →</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Placa</th><th>Motorista</th><th>Status</th><th>Cap.</th></tr>
          </thead>
          <tbody id="fleetTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
TMS.initLayout('index');

document.getElementById('pageDate').textContent = new Date().toLocaleDateString('pt-BR', {weekday:'long',day:'numeric',month:'long',year:'numeric'});

async function load() {
  const [vehicles, routes] = await Promise.all([TMS.fetchVehicles(), TMS.fetchRoutes()]);

  const em_rota = vehicles.filter(v=>v.status==='em_rota').length;
  const disp = vehicles.filter(v=>v.status==='disponivel').length;
  const today = new Date().toDateString();
  const rotasHoje = routes.filter(r=>new Date(r.criado_em).toDateString()===today).length;

  document.getElementById('kTotal').textContent = vehicles.length;
  document.getElementById('kRota').textContent = em_rota;
  document.getElementById('kDisp').textContent = disp;
  document.getElementById('kRotasHoje').textContent = rotasHoje;

  const statusCount = {};
  vehicles.forEach(v=>statusCount[v.status]=(statusCount[v.status]||0)+1);
  new Chart(document.getElementById('chartFrota'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(statusCount).map(s=>TMS.statusMap[s]?.[1]||s),
      datasets: [{data:Object.values(statusCount),backgroundColor:['#3b82f6','#22c55e','#eab308','#ef4444','#4b5a6e'],borderWidth:0,hoverOffset:6}]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:11},boxWidth:10,padding:12}}},
      cutout:'65%'
    }
  });

  const rotaCount = {};
  routes.forEach(r=>rotaCount[r.status]=(rotaCount[r.status]||0)+1);
  new Chart(document.getElementById('chartRotas'), {
    type: 'bar',
    data: {
      labels: Object.keys(rotaCount).map(s=>TMS.statusMap[s]?.[1]||s),
      datasets: [{data:Object.values(rotaCount),backgroundColor:['#3b82f633','#22c55e33','#eab30833','#ef444433'],borderColor:['#3b82f6','#22c55e','#eab308','#ef4444'],borderWidth:2,borderRadius:6}]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#4b5a6e',font:{size:10}},grid:{display:false}},
        y:{ticks:{color:'#4b5a6e',font:{size:10}},grid:{color:'#2a3040'},beginAtZero:true}
      }
    }
  });

  document.getElementById('recentRoutes').innerHTML = routes.slice(0,5).map(r=>`
    <tr>
      <td>${r.nome}</td>
      <td>${TMS.badge(r.status)}</td>
      <td style="font-family:var(--mono);font-size:12px">${r.distancia_km}km</td>
      <td style="font-family:var(--mono);font-size:12px">${r.paradas?.length||0}</td>
    </tr>`).join('');

  document.getElementById('fleetTable').innerHTML = vehicles.slice(0,6).map(v=>`
    <tr>
      <td style="font-family:var(--mono)">${v.placa}</td>
      <td>${v.motorista||'—'}</td>
      <td>${TMS.badge(v.status)}</td>
      <td style="font-family:var(--mono);font-size:12px">${v.capacidade_kg}kg</td>
    </tr>`).join('');
}

load();
</script>
</body>
</html>
