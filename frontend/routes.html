<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rotas | TMS</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=1.0.0-rc1" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <section class="app-main">
      <header id="topbar"></header>
      <main class="page">
        <div class="page-header">
          <div><h1>Rotas</h1><p>Monte cargas, ordene paradas e acompanhe a execução das viagens.</p></div>
          <div class="actions">
            <button id="refreshRoutes" class="btn btn-light" type="button">↻ Atualizar</button>
            <button id="newRouteButton" class="btn btn-primary" type="button">＋ Nova rota</button>
          </div>
        </div>

        <section class="stats-grid">
          <article class="stat-card"><div class="stat-label">Total</div><div id="routeTotal" class="stat-value">0</div></article>
          <article class="stat-card"><div class="stat-label">Abertas</div><div id="routeOpen" class="stat-value">0</div></article>
          <article class="stat-card"><div class="stat-label">Em andamento</div><div id="routeProgress" class="stat-value">0</div></article>
          <article class="stat-card"><div class="stat-label">Concluídas</div><div id="routeDone" class="stat-value">0</div></article>
        </section>

        <section class="card">
          <div class="card-header">
            <h2>Rotas cadastradas</h2>
            <div class="filters">
              <input id="routeSearch" class="control search-control" type="search" placeholder="Buscar rota, placa ou motorista" />
              <select id="routeStatusFilter" class="control"><option value="">Todos os status</option><option value="aberta">Aberta</option><option value="em_andamento">Em andamento</option><option value="concluida">Concluida</option><option value="cancelada">Cancelada</option></select>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table" style="min-width: 1150px">
              <thead><tr><th>ID</th><th>Rota/Data</th><th>Veículo</th><th>Motorista</th><th>Entregas</th><th>Distância</th><th>Status</th><th>Criação</th><th>Ações</th></tr></thead>
              <tbody id="routesBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </section>
  </div>

  <div id="routeModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal large">
      <div class="modal-header"><h2>Nova rota</h2><button class="icon-button" type="button" data-close-modal="routeModal">×</button></div>
      <form id="routeForm">
        <div class="modal-body">
          <div class="form-grid">
            <div class="field"><label for="routeName">Nome da rota *</label><input id="routeName" maxlength="140" placeholder="Ex.: Grande Sao Paulo 01" required /></div>
            <div class="field"><label for="routeVehicle">Veículo *</label><select id="routeVehicle" required></select></div>
            <div class="field"><label for="routeDriver">Motorista</label><select id="routeDriver"></select></div>
            <div class="field"><label for="routeScheduledDate">Data prevista</label><input id="routeScheduledDate" type="date" /></div>
            <div class="field full"><label for="routeNotes">Observações</label><textarea id="routeNotes" maxlength="2000"></textarea></div>
          </div>

          <div style="display:flex; justify-content:space-between; gap:12px; margin:22px 0 10px; flex-wrap:wrap">
            <strong>Entregas disponíveis — <span id="selectedDeliveryCounter" class="selected-counter">0 selecionadas</span></strong>
            <span id="routeDistancePreview" class="muted small"></span>
          </div>
          <div class="delivery-picker">
            <div class="delivery-picker-toolbar">
              <input id="routeDeliverySearch" class="control search-control" type="search" placeholder="Buscar NF, cliente, cidade ou endereço" />
              <button id="selectVisibleDeliveries" class="btn btn-light btn-sm" type="button">Selecionar visíveis</button>
              <button id="clearSelectedDeliveries" class="btn btn-light btn-sm" type="button">Limpar</button>
              <button id="optimizeSelectionButton" class="btn btn-light btn-sm" type="button">Otimizar ordem</button>
            </div>
            <div id="routeDeliveryList" class="delivery-picker-list"></div>
          </div>
        </div>
        <div class="modal-footer"><button class="btn btn-light" type="button" data-close-modal="routeModal">Cancelar</button><button id="saveRouteButton" class="btn btn-primary" type="submit">Criar rota</button></div>
      </form>
    </div>
  </div>

  <div id="routeDetailsModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal large">
      <div class="modal-header"><h2>Detalhes da rota</h2><button class="icon-button" type="button" data-close-modal="routeDetailsModal">×</button></div>
      <div id="routeDetailsContent" class="modal-body"></div>
      <div class="modal-footer"><button class="btn btn-light" type="button" data-close-modal="routeDetailsModal">Fechar</button></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="/assets/js/routes.js?v=1.0.0-rc1"></script>
</body>
</html>
