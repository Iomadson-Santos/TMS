<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veiculos | TMS</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=1.0.0-rc1" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <section class="app-main">
      <header id="topbar"></header>
      <main class="page">
        <div class="page-header">
          <div><h1>Veiculos</h1><p>Cadastre a frota e acompanhe sua disponibilidade.</p></div>
          <div class="actions">
            <button id="refreshVehicles" class="btn btn-light" type="button">↻ Atualizar</button>
            <button id="newVehicleButton" class="btn btn-primary" type="button">＋ Novo veiculo</button>
          </div>
        </div>

        <section class="stats-grid">
          <article class="stat-card"><div class="stat-label">Total</div><div id="vehicleTotal" class="stat-value">0</div></article>
          <article class="stat-card"><div class="stat-label">Disponiveis</div><div id="vehicleAvailable" class="stat-value">0</div></article>
          <article class="stat-card"><div class="stat-label">Em rota</div><div id="vehicleInRoute" class="stat-value">0</div></article>
          <article class="stat-card"><div class="stat-label">Manutencao</div><div id="vehicleMaintenance" class="stat-value">0</div></article>
        </section>

        <section class="card">
          <div class="card-header">
            <h2>Frota cadastrada</h2>
            <div class="filters">
              <input id="vehicleSearch" class="control search-control" type="search" placeholder="Buscar placa, marca ou modelo" />
              <select id="vehicleStatusFilter" class="control">
                <option value="">Todos os status</option>
                <option value="disponivel">Disponivel</option>
                <option value="em_rota">Em rota</option>
                <option value="manutencao">Manutencao</option>
                <option value="inativo">Inativo</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Placa</th><th>Marca</th><th>Modelo</th><th>Ano</th><th>Capacidade</th><th>Cubagem</th><th>KM</th><th>Status</th><th>Acoes</th></tr></thead>
              <tbody id="vehiclesBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </section>
  </div>

  <div id="vehicleModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <div class="modal-header"><h2 id="vehicleModalTitle">Novo veiculo</h2><button class="icon-button" type="button" data-close-modal="vehicleModal">×</button></div>
      <form id="vehicleForm">
        <div class="modal-body">
          <div class="form-grid">
            <div class="field"><label for="vehiclePlate">Placa *</label><input id="vehiclePlate" maxlength="10" required /></div>
            <div class="field"><label for="vehicleBrand">Marca</label><input id="vehicleBrand" maxlength="80" /></div>
            <div class="field"><label for="vehicleModel">Modelo *</label><input id="vehicleModel" maxlength="120" required /></div>
            <div class="field"><label for="vehicleYear">Ano</label><input id="vehicleYear" type="number" min="1950" max="2100" /></div>
            <div class="field"><label for="vehicleCapacityKg">Capacidade (kg)</label><input id="vehicleCapacityKg" type="number" min="0" step="0.01" /></div>
            <div class="field"><label for="vehicleCapacityM3">Cubagem (m³)</label><input id="vehicleCapacityM3" type="number" min="0" step="0.001" /></div>
            <div class="field"><label for="vehicleCurrentKm">Quilometragem</label><input id="vehicleCurrentKm" type="number" min="0" value="0" /></div>
            <div class="field"><label for="vehicleStatus">Status</label><select id="vehicleStatus"><option value="disponivel">Disponivel</option><option value="em_rota">Em rota</option><option value="manutencao">Manutencao</option><option value="inativo">Inativo</option></select></div>
          </div>
        </div>
        <div class="modal-footer"><button class="btn btn-light" type="button" data-close-modal="vehicleModal">Cancelar</button><button id="saveVehicleButton" class="btn btn-primary" type="submit">Salvar</button></div>
      </form>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="/assets/js/vehicles.js?v=1.0.0-rc1"></script>
</body>
</html>
