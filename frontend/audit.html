<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auditoria | TMS</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=1.0.0-rc1" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <section class="app-main">
      <header id="topbar"></header>
      <main class="page">
        <div class="page-header"><div><h1>Auditoria</h1><p>Consulte acessos e alteracoes realizadas no sistema.</p></div><button id="refreshAudit" class="btn btn-light" type="button">↻ Atualizar</button></div>
        <section class="stats-grid">
          <article class="stat-card"><div class="stat-label">Registros carregados</div><div id="auditTotal" class="stat-value">0</div></article>
          <article class="stat-card"><div class="stat-label">Logins</div><div id="auditLogins" class="stat-value">0</div></article>
          <article class="stat-card"><div class="stat-label">Criacoes</div><div id="auditCreates" class="stat-value">0</div></article>
          <article class="stat-card"><div class="stat-label">Alteracoes</div><div id="auditChanges" class="stat-value">0</div></article>
        </section>
        <section class="card">
          <div class="card-header"><h2>Historico</h2><div class="filters"><select id="auditEntityFilter" class="control"><option value="">Todas as entidades</option><option value="auth">Autenticacao</option><option value="user">Usuario</option><option value="vehicle">Veiculo</option><option value="delivery">Entrega</option><option value="route">Rota</option></select><select id="auditActionFilter" class="control"><option value="">Todas as acoes</option><option value="login">Login realizado</option><option value="login_failed">Falha de login</option><option value="login_locked">Login bloqueado</option><option value="logout">Saida</option><option value="password_change">Troca de senha</option><option value="create">Criacao</option><option value="update">Alteracao</option><option value="delete">Exclusao</option><option value="status_change">Mudanca de status</option><option value="optimize">Otimizacao</option></select></div></div>
          <div class="table-wrap"><table class="data-table" style="min-width:1200px"><thead><tr><th>ID</th><th>Data</th><th>Usuario</th><th>Acao</th><th>Entidade</th><th>Registro</th><th>Detalhes</th><th>IP</th></tr></thead><tbody id="auditBody"></tbody></table></div>
        </section>
      </main>
    </section>
  </div>
  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="/assets/js/audit.js?v=1.0.0-rc1"></script>
</body>
</html>
