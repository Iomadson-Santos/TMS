<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TMS · Entregas</title>
  <script src="tms.js"></script>
</head>
<body>

<div class="topbar">
  <div>
    <span class="topbar-title">Entregas</span>
    <span class="topbar-breadcrumb">/ cadastro e gestão</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-time" id="clock"></span>
    <button class="btn btn-primary" onclick="openModal()">+ Nova Entrega</button>
  </div>
</div>

<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Entregas</div>
      <div class="page-sub" id="deliverySub">Carregando...</div>
    </div>
  </div>

  <!-- KPIs -->
  <div class="grid-4" style="margin-bottom:20px" id="kpiRow"></div>

  <!-- Tabela -->
  <div class="card">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" type="text" id="searchInput" placeholder="Buscar por NF, cliente, CNPJ ou endereço..." oninput="filterTable()"/>
      </div>
      <select class="filter-select" id="filterStatus" onchange="filterTable()">
        <option value="">Todos os status</option>
        <option value="pendente">Pendente</option>
        <option value="em_rota">Em Rota</option>
        <option value="entregue">Entregue</option>
        <option value="devolvido">Devolvido</option>
        <option value="cancelado">Cancelado</option>
      </select>
      <select class="filter-select" id="filterRota" onchange="filterTable()">
        <option value="">Todas</option>
        <option value="sem_rota">Sem rota atribuída</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th onclick="sortTable('id')" style="cursor:pointer">ID ↕</th>
            <th onclick="sortTable('nf_numero')" style="cursor:pointer">Nota Fiscal ↕</th>
            <th onclick="sortTable('nome_fantasia')" style="cursor:pointer">Cliente ↕</th>
            <th>CNPJ/CPF</th>
            <th>Endereço</th>
            <th onclick="sortTable('peso_kg')" style="cursor:pointer">Peso ↕</th>
            <th>Volume</th>
            <th>Status</th>
            <th>Rota</th>
            <th onclick="sortTable('criado_em')" style="cursor:pointer">Cadastro ↕</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="deliveryTableBody"></tbody>
      </table>
    </div>
    <div id="tableFooter" style="padding:12px 14px;font-size:11px;color:var(--text3);font-family:var(--mono);border-top:1px solid var(--border)"></div>
  </div>
</div>

<!-- Modal Cadastro/Edição -->
<div class="modal-backdrop" id="modal">
  <div class="modal" style="width:560px">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Nova Entrega</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="editId"/>

    <!-- NF -->
    <div style="font-size:10px;font-family:var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">Nota Fiscal</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Número da NF *</label>
        <input type="text" class="form-input" id="dNfNumero" placeholder="000123456"/>
      </div>
      <div class="form-group">
        <label class="form-label">Série</label>
        <input type="text" class="form-input" id="dNfSerie" placeholder="1" value="1"/>
      </div>
    </div>

    <!-- Cliente -->
    <div style="font-size:10px;font-family:var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">Cliente</div>
    <div class="form-group">
      <label class="form-label">Nome Fantasia *</label>
      <input type="text" class="form-input" id="dNomeFantasia" placeholder="Ex: Mercado Central"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">CNPJ / CPF</label>
        <input type="text" class="form-input" id="dCnpjCpf" placeholder="00.000.000/0001-00"/>
      </div>
      <div class="form-group">
        <label class="form-label">Telefone</label>
        <input type="text" class="form-input" id="dTelefone" placeholder="(11) 99999-9999"/>
      </div>
    </div>

    <!-- Endereço -->
    <div style="font-size:10px;font-family:var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">Endereço de Entrega</div>
    <div class="form-group">
      <label class="form-label">Endereço completo *</label>
      <input type="text" class="form-input" id="dEndereco" placeholder="Rua, número, bairro"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Cidade</label>
        <input type="text" class="form-input" id="dCidade" placeholder="São Paulo"/>
      </div>
      <div class="form-group">
        <label class="form-label">Estado</label>
        <select class="form-select" id="dEstado">
          <option value="">Selecione</option>
          <option value="SP">SP</option><option value="RJ">RJ</option>
          <option value="MG">MG</option><option value="RS">RS</option>
          <option value="PR">PR</option><option value="SC">SC</option>
          <option value="BA">BA</option><option value="GO">GO</option>
          <option value="DF">DF</option><option value="ES">ES</option>
          <option value="PE">PE</option><option value="CE">CE</option>
          <option value="AM">AM</option><option value="PA">PA</option>
          <option value="MT">MT</option><option value="MS">MS</option>
          <option value="RO">RO</option><option value="TO">TO</option>
          <option value="MA">MA</option><option value="PI">PI</option>
          <option value="AL">AL</option><option value="SE">SE</option>
          <option value="RN">RN</option><option value="PB">PB</option>
          <option value="AC">AC</option><option value="AP">AP</option>
          <option value="RR">RR</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">CEP</label>
        <input type="text" class="form-input" id="dCep" placeholder="00000-000"/>
      </div>
      <div class="form-group">
        <label class="form-label" style="visibility:hidden">_</label>
        <button class="btn btn-secondary" style="width:100%" onclick="buscarCep()">🔍 Buscar CEP</button>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Latitude (opcional)</label>
        <input type="number" class="form-input" id="dLat" placeholder="-23.5505" step="0.0001"/>
      </div>
      <div class="form-group">
        <label class="form-label">Longitude (opcional)</label>
        <input type="number" class="form-input" id="dLng" placeholder="-46.6333" step="0.0001"/>
      </div>
    </div>

    <!-- Carga -->
    <div style="font-size:10px;font-family:var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">Carga</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Peso (kg)</label>
        <input type="number" class="form-input" id="dPeso" placeholder="0.0" step="0.1"/>
      </div>
      <div class="form-group">
        <label class="form-label">Volume (m³)</label>
        <input type="number" class="form-input" id="dVolume" placeholder="0.0" step="0.01"/>
      </div>
    </div>

    <!-- Observações -->
    <div class="form-group">
      <label class="form-label">Observações / Instruções especiais</label>
      <textarea class="form-input" id="dObs" rows="2" placeholder="Ex: Entregar somente ao responsável, fragil, refrigerado..." style="resize:vertical"></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" style="flex:2" onclick="saveDelivery()">Salvar Entrega</button>
    </div>
  </div>
</div>

<!-- Modal Atribuir Rota -->
<div class="modal-backdrop" id="modalRota">
  <div class="modal" style="width:420px">
    <div class="modal-header">
      <div class="modal-title">Atribuir à Rota</div>
      <button class="modal-close" onclick="closeModalRota()">✕</button>
    </div>
    <input type="hidden" id="atribuirId"/>
    <p style="font-size:13px;color:var(--text2);margin-bottom:16px">Selecione a rota para vincular esta entrega:</p>
    <div class="form-group">
      <label class="form-label">Rota</label>
      <select class="form-select" id="selectRota"></select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModalRota()">Cancelar</button>
      <button class="btn btn-primary" style="flex:2" onclick="confirmarAtribuirRota()">Atribuir</button>
    </div>
  </div>
</div>

<script>
TMS.initLayout('deliveries');

let allDeliveries = [], allRoutes = [];
let sortKey = 'id', sortAsc = false;

const deliveryStatusMap = {
  pendente:  ['badge-yellow', 'Pendente'],
  em_rota:   ['badge-blue',   'Em Rota'],
  entregue:  ['badge-green',  'Entregue'],
  devolvido: ['badge-red',    'Devolvido'],
  cancelado: ['badge-gray',   'Cancelado'],
};

async function load() {
  [allDeliveries, allRoutes] = await Promise.all([fetchDeliveries(), TMS.fetchRoutes()]);
  renderKPIs();
  filterTable();
}

async function fetchDeliveries() {
  try {
    const r = await fetch(`${TMS.API}/deliveries/`);
    return await r.json();
  } catch {
    return [
      {id:1,nf_numero:'000001',nf_serie:'1',nome_fantasia:'Mercado Central',cnpj_cpf:'12.345.678/0001-90',telefone:'(11)3333-4444',endereco:'Av. Paulista, 1000',cidade:'São Paulo',estado:'SP',cep:'01310-100',peso_kg:250,volume_m3:1.2,status:'pendente',route_id:null,criado_em:'2026-03-15T08:00:00',observacao:''},
      {id:2,nf_numero:'000002',nf_serie:'1',nome_fantasia:'Padaria do João',cnpj_cpf:'98.765.432/0001-10',telefone:'(11)2222-3333',endereco:'R. Augusta, 500',cidade:'São Paulo',estado:'SP',cep:'01305-000',peso_kg:80,volume_m3:0.5,status:'em_rota',route_id:1,criado_em:'2026-03-15T09:00:00',observacao:'Entregar antes das 10h'},
      {id:3,nf_numero:'000003',nf_serie:'1',nome_fantasia:'Farmácia Saúde',cnpj_cpf:'11.222.333/0001-44',telefone:'(11)5555-6666',endereco:'Al. Santos, 200',cidade:'São Paulo',estado:'SP',cep:'01419-000',peso_kg:15,volume_m3:0.1,status:'entregue',route_id:1,criado_em:'2026-03-14T10:00:00',observacao:'Produto frágil'},
    ];
  }
}

function renderKPIs() {
  const counts = {pendente:0,em_rota:0,entregue:0,devolvido:0,cancelado:0};
  let totalPeso = 0;
  allDeliveries.forEach(d => { counts[d.status]=(counts[d.status]||0)+1; totalPeso+=d.peso_kg||0; });
  const semRota = allDeliveries.filter(d=>!d.route_id && d.status==='pendente').length;
  document.getElementById('kpiRow').innerHTML = `
    <div class="card"><div class="card-title">Total Entregas</div><div class="kpi-value">${allDeliveries.length}</div><div class="kpi-sub">cadastradas</div></div>
    <div class="card"><div class="card-title">Pendentes</div><div class="kpi-value" style="color:var(--yellow)">${counts.pendente}</div><div class="kpi-sub">${semRota} sem rota</div></div>
    <div class="card"><div class="card-title">Em Rota</div><div class="kpi-value" style="color:var(--accent)">${counts.em_rota}</div><div class="kpi-sub">em andamento</div></div>
    <div class="card"><div class="card-title">Entregues</div><div class="kpi-value" style="color:var(--green)">${counts.entregue}</div><div class="kpi-sub">${totalPeso.toFixed(0)}kg total</div></div>
  `;
  document.getElementById('deliverySub').textContent = `${allDeliveries.length} entregas · ${semRota} aguardando rota`;
}

function filterTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const status = document.getElementById('filterStatus').value;
  const rota = document.getElementById('filterRota').value;

  let filtered = allDeliveries.filter(d => {
    const matchSearch = !search ||
      d.nf_numero.toLowerCase().includes(search) ||
      d.nome_fantasia.toLowerCase().includes(search) ||
      (d.cnpj_cpf||'').toLowerCase().includes(search) ||
      d.endereco.toLowerCase().includes(search);
    const matchStatus = !status || d.status === status;
    const matchRota = !rota || (rota === 'sem_rota' ? !d.route_id : true);
    return matchSearch && matchStatus && matchRota;
  });

  filtered.sort((a,b) => {
    let va=a[sortKey], vb=b[sortKey];
    if (va==null) va=''; if (vb==null) vb='';
    if (typeof va==='string') { va=va.toLowerCase(); vb=vb.toLowerCase(); }
    return sortAsc ? (va>vb?1:-1) : (va<vb?1:-1);
  });

  renderTable(filtered);
}

function sortTable(key) {
  if (sortKey===key) sortAsc=!sortAsc; else { sortKey=key; sortAsc=true; }
  filterTable();
}

function renderTable(data) {
  const body = document.getElementById('deliveryTableBody');
  if (!data.length) {
    body.innerHTML = `<tr><td colspan="11"><div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">Nenhuma entrega encontrada</div></div></td></tr>`;
    document.getElementById('tableFooter').textContent = '0 resultados';
    return;
  }

  body.innerHTML = data.map(d => {
    const [cls,label] = deliveryStatusMap[d.status]||['badge-gray',d.status];
    const rota = d.route_id ? allRoutes.find(r=>r.id===d.route_id) : null;
    const rotaLabel = rota
      ? `<span style="font-family:var(--mono);font-size:11px;color:var(--accent)">${rota.nome}</span>`
      : `<span style="color:var(--text3);font-size:11px">—</span>`;

    return `<tr>
      <td style="font-family:var(--mono);color:var(--text3)">#${String(d.id).padStart(4,'0')}</td>
      <td>
        <div style="font-family:var(--mono);font-weight:700">${d.nf_numero}</div>
        <div style="font-size:10px;color:var(--text3)">Série ${d.nf_serie||'1'}</div>
      </td>
      <td>
        <div style="font-weight:600">${d.nome_fantasia}</div>
        <div style="font-size:11px;color:var(--text3);font-family:var(--mono)">${d.cnpj_cpf||''}</div>
      </td>
      <td style="font-family:var(--mono);font-size:11px">${d.cnpj_cpf||'<span style="color:var(--text3)">—</span>'}</td>
      <td>
        <div style="font-size:12px">${d.endereco}</div>
        <div style="font-size:10px;color:var(--text3)">${[d.cidade,d.estado].filter(Boolean).join(' · ')}</div>
      </td>
      <td style="font-family:var(--mono)">${d.peso_kg||0}kg</td>
      <td style="font-family:var(--mono)">${d.volume_m3||0}m³</td>
      <td><span class="badge ${cls}">${label}</span></td>
      <td>${rotaLabel}</td>
      <td style="font-size:11px;color:var(--text3)">${new Date(d.criado_em).toLocaleDateString('pt-BR')}</td>
      <td>
        <div style="display:flex;gap:4px">
          <button class="btn btn-secondary" style="padding:4px 8px;font-size:10px" title="Editar" onclick="editDelivery(${d.id})">✏️</button>
          ${!d.route_id && d.status==='pendente' ? `<button class="btn btn-secondary" style="padding:4px 8px;font-size:10px;color:var(--accent)" title="Atribuir rota" onclick="openModalRota(${d.id})">🗺️</button>` : ''}
          ${d.status==='em_rota' ? `<button class="btn btn-secondary" style="padding:4px 8px;font-size:10px;color:var(--green)" title="Concluir" onclick="concluirEntrega(${d.id})">✓</button>` : ''}
          <button class="btn btn-danger" style="padding:4px 8px;font-size:10px" title="Excluir" onclick="deleteDelivery(${d.id})">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('tableFooter').textContent = `Exibindo ${data.length} de ${allDeliveries.length} entregas`;
}

// ── Modal ─────────────────────────────────────────────────
function openModal() {
  document.getElementById('editId').value = '';
  document.getElementById('modalTitle').textContent = 'Nova Entrega';
  ['dNfNumero','dNfSerie','dNomeFantasia','dCnpjCpf','dTelefone','dEndereco','dCidade','dCep','dLat','dLng','dPeso','dVolume','dObs'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = id==='dNfSerie'?'1':'';
  });
  document.getElementById('dEstado').value = '';
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

function editDelivery(id) {
  const d = allDeliveries.find(x=>x.id===id); if (!d) return;
  document.getElementById('editId').value = d.id;
  document.getElementById('modalTitle').textContent = 'Editar Entrega';
  document.getElementById('dNfNumero').value = d.nf_numero;
  document.getElementById('dNfSerie').value = d.nf_serie||'1';
  document.getElementById('dNomeFantasia').value = d.nome_fantasia;
  document.getElementById('dCnpjCpf').value = d.cnpj_cpf||'';
  document.getElementById('dTelefone').value = d.telefone||'';
  document.getElementById('dEndereco').value = d.endereco;
  document.getElementById('dCidade').value = d.cidade||'';
  document.getElementById('dEstado').value = d.estado||'';
  document.getElementById('dCep').value = d.cep||'';
  document.getElementById('dLat').value = d.lat||'';
  document.getElementById('dLng').value = d.lng||'';
  document.getElementById('dPeso').value = d.peso_kg||'';
  document.getElementById('dVolume').value = d.volume_m3||'';
  document.getElementById('dObs').value = d.observacao||'';
  document.getElementById('modal').classList.add('show');
}

async function saveDelivery() {
  const id = document.getElementById('editId').value;
  const body = {
    nf_numero:     document.getElementById('dNfNumero').value.trim(),
    nf_serie:      document.getElementById('dNfSerie').value.trim()||'1',
    nome_fantasia: document.getElementById('dNomeFantasia').value.trim(),
    cnpj_cpf:      document.getElementById('dCnpjCpf').value.trim()||null,
    telefone:      document.getElementById('dTelefone').value.trim()||null,
    endereco:      document.getElementById('dEndereco').value.trim(),
    cidade:        document.getElementById('dCidade').value.trim()||null,
    estado:        document.getElementById('dEstado').value||null,
    cep:           document.getElementById('dCep').value.trim()||null,
    lat:           parseFloat(document.getElementById('dLat').value)||null,
    lng:           parseFloat(document.getElementById('dLng').value)||null,
    peso_kg:       parseFloat(document.getElementById('dPeso').value)||0,
    volume_m3:     parseFloat(document.getElementById('dVolume').value)||0,
    observacao:    document.getElementById('dObs').value.trim()||null,
  };
  if (!body.nf_numero || !body.nome_fantasia || !body.endereco) {
    alert('Preencha NF, nome do cliente e endereço.'); return;
  }
  try {
    if (id) {
      await fetch(`${TMS.API}/deliveries/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    } else {
      await fetch(`${TMS.API}/deliveries/`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }
    await load();
  } catch {
    if (id) {
      const i=allDeliveries.findIndex(x=>x.id===parseInt(id));
      if(i>=0) allDeliveries[i]={...allDeliveries[i],...body};
    } else {
      allDeliveries.push({...body,id:allDeliveries.length+1,status:'pendente',route_id:null,criado_em:new Date().toISOString()});
    }
    renderKPIs(); filterTable();
  }
  closeModal();
}

async function deleteDelivery(id) {
  if (!confirm('Excluir esta entrega?')) return;
  try { await fetch(`${TMS.API}/deliveries/${id}`,{method:'DELETE'}); await load(); }
  catch { allDeliveries=allDeliveries.filter(x=>x.id!==id); renderKPIs(); filterTable(); }
}

async function concluirEntrega(id) {
  try { await fetch(`${TMS.API}/deliveries/${id}/concluir`,{method:'PATCH'}); await load(); }
  catch {
    const d=allDeliveries.find(x=>x.id===id); if(d) d.status='entregue';
    renderKPIs(); filterTable();
  }
}

// ── Atribuir rota ─────────────────────────────────────────
function openModalRota(id) {
  document.getElementById('atribuirId').value = id;
  const sel = document.getElementById('selectRota');
  sel.innerHTML = allRoutes
    .filter(r=>r.status==='planejada'||r.status==='em_andamento')
    .map(r=>`<option value="${r.id}">${r.nome} (${TMS.statusMap[r.status]?.[1]||r.status})</option>`)
    .join('');
  document.getElementById('modalRota').classList.add('show');
}

function closeModalRota() { document.getElementById('modalRota').classList.remove('show'); }

async function confirmarAtribuirRota() {
  const id = document.getElementById('atribuirId').value;
  const routeId = document.getElementById('selectRota').value;
  if (!routeId) { alert('Selecione uma rota.'); return; }
  try {
    await fetch(`${TMS.API}/deliveries/${id}/atribuir-rota/${routeId}`,{method:'PATCH'});
    await load();
  } catch {
    const d=allDeliveries.find(x=>x.id===parseInt(id));
    if(d){d.route_id=parseInt(routeId);d.status='em_rota';}
    renderKPIs(); filterTable();
  }
  closeModalRota();
}

// ── Busca CEP ─────────────────────────────────────────────
async function buscarCep() {
  const cep = document.getElementById('dCep').value.replace(/\D/g,'');
  if (cep.length !== 8) { alert('CEP inválido.'); return; }
  try {
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const data = await r.json();
    if (data.erro) { alert('CEP não encontrado.'); return; }
    document.getElementById('dEndereco').value = `${data.logradouro}, ${data.bairro}`;
    document.getElementById('dCidade').value = data.localidade;
    document.getElementById('dEstado').value = data.uf;
  } catch { alert('Erro ao buscar CEP.'); }
}

load();
</script>
