<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entregas | TMS</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=1.0.0-rc1" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <section class="app-main">
      <header id="topbar"></header>
      <main class="page">
        <div class="page-header">
          <div><h1>Entregas</h1><p>Gerencie notas fiscais, destinos, valores e o andamento das entregas.</p></div>
          <div class="actions">
            <button id="refreshDeliveries" class="btn btn-light" type="button">↻ Atualizar</button>
            <button id="newDeliveryButton" class="btn btn-primary" type="button">＋ Nova entrega</button>
          </div>
        </div>

        <section class="stats-grid">
          <article class="stat-card"><div class="stat-label">Total</div><div id="deliveryTotal" class="stat-value">0</div></article>
          <article class="stat-card"><div class="stat-label">Pendentes</div><div id="deliveryPending" class="stat-value">0</div></article>
          <article class="stat-card"><div class="stat-label">Em rota</div><div id="deliveryInRoute" class="stat-value">0</div></article>
          <article class="stat-card"><div class="stat-label">Entregues</div><div id="deliveryDone" class="stat-value">0</div></article>
        </section>

        <section class="card">
          <div class="card-header">
            <h2>Entregas cadastradas</h2>
            <div class="filters">
              <input id="deliverySearch" class="control search-control" type="search" placeholder="Buscar NF, cliente, documento ou cidade" />
              <select id="deliveryStatusFilter" class="control">
                <option value="">Todos os status</option>
                <option value="recebida">Recebida</option><option value="separada">Separada</option><option value="faturada">Faturada</option><option value="pendente">Pendente</option><option value="em_rota">Em rota</option><option value="entregue">Entregue</option><option value="devolvida">Devolvida</option><option value="cancelada">Cancelada</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table" style="min-width: 1250px">
              <thead><tr><th>ID</th><th>NF</th><th>Cliente</th><th>Destino</th><th>Peso</th><th>Valor NF</th><th>Frete</th><th>Rota/Ordem</th><th>Status</th><th>Acoes</th></tr></thead>
              <tbody id="deliveriesBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </section>
  </div>

  <div id="deliveryModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal large">
      <div class="modal-header"><h2 id="deliveryModalTitle">Nova entrega</h2><button class="icon-button" type="button" data-close-modal="deliveryModal">×</button></div>
      <form id="deliveryForm">
        <div class="modal-body">
          <div class="form-grid">
            <div class="field"><label for="deliveryInvoice">Numero da NF *</label><input id="deliveryInvoice" maxlength="60" required /></div>
            <div class="field"><label for="deliveryCustomer">Cliente *</label><input id="deliveryCustomer" maxlength="180" required /></div>
            <div class="field"><label for="deliveryDocument">CNPJ/CPF</label><input id="deliveryDocument" maxlength="30" /></div>
            <div class="field"><label for="deliveryPostalCode">CEP</label><input id="deliveryPostalCode" maxlength="12" /></div>
            <div class="field full"><label for="deliveryAddress">Endereco *</label><input id="deliveryAddress" maxlength="255" required /></div>
            <div class="field"><label for="deliveryCity">Cidade *</label><input id="deliveryCity" maxlength="100" required /></div>
            <div class="field"><label for="deliveryState">UF *</label><input id="deliveryState" maxlength="2" value="SP" required /></div>
            <div class="field"><label for="deliveryLatitude">Latitude</label><input id="deliveryLatitude" type="number" step="any" min="-90" max="90" /></div>
            <div class="field"><label for="deliveryLongitude">Longitude</label><input id="deliveryLongitude" type="number" step="any" min="-180" max="180" /></div>
            <div class="field"><label for="deliveryWeight">Peso (kg)</label><input id="deliveryWeight" type="number" step="0.01" min="0" /></div>
            <div class="field"><label for="deliveryVolume">Cubagem (m³)</label><input id="deliveryVolume" type="number" step="0.001" min="0" /></div>
            <div class="field"><label for="deliveryInvoiceValue">Valor da NF</label><input id="deliveryInvoiceValue" type="number" step="0.01" min="0" /></div>
            <div class="field"><label for="deliveryFreightValue">Valor do frete</label><input id="deliveryFreightValue" type="number" step="0.01" min="0" /></div>
            <div class="field"><label for="deliveryStatus">Status</label><select id="deliveryStatus"><option value="recebida">Recebida</option><option value="separada">Separada</option><option value="faturada">Faturada</option><option value="pendente">Pendente</option><option value="em_rota">Em rota</option><option value="entregue">Entregue</option><option value="devolvida">Devolvida</option><option value="cancelada">Cancelada</option></select></div>
          </div>
        </div>
        <div class="modal-footer"><button class="btn btn-light" type="button" data-close-modal="deliveryModal">Cancelar</button><button id="saveDeliveryButton" class="btn btn-primary" type="submit">Salvar</button></div>
      </form>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script type="module" src="/assets/js/deliveries.js?v=1.0.0-rc1"></script>
</body>
</html>
