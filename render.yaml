services:
  - type: web
    name: tms-ciranda-prod
    runtime: python
    region: virginia
    branch: production-v1
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
    preDeployCommand: bash ./predeploy_render.sh
    startCommand: bash ./start_render.sh
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: TMS Ciranda
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: tms-ciranda-prod
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: tms-ciranda-prod
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: tms-ciranda-prod
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: tms-ciranda-prod-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: BOOTSTRAP_ADMIN_ENABLED
        value: "false"
      - key: DEMO_SEED_ENABLED
        value: "false"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: ENABLE_API_TOKEN_ENDPOINT
        value: "false"
      - key: AUTH_COOKIE_NAME
        value: __Host-tms_session
      - key: REFRESH_COOKIE_NAME
        value: __Host-tms_refresh
      - key: CSRF_COOKIE_NAME
        value: __Host-tms_csrf
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: FORCE_HTTPS
        value: "false"
      - key: PLATFORM_HTTPS_ENFORCED
        value: "true"
      - key: HSTS_ENABLED
        value: "true"
      - key: HSTS_MAX_AGE_SECONDS
        value: "31536000"
      - key: HSTS_INCLUDE_SUBDOMAINS
        value: "false"
      - key: PASSWORD_MIN_LENGTH
        value: "15"
      - key: LOGIN_MAX_ATTEMPTS
        value: "3"
      - key: LOGIN_IP_MAX_ATTEMPTS
        value: "20"
      - key: LOGIN_LOCK_SECONDS
        value: "30"
      - key: LOGIN_LOCK_MAX_SECONDS
        value: "300"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: SESSION_IDLE_MINUTES
        value: "720"
      - key: MAX_ACTIVE_SESSIONS_PER_USER
        value: "5"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_TO_STDOUT
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RUN_MIGRATIONS_ON_START
        value: "false"

databases:
  - name: tms-ciranda-prod-db
    region: virginia
    plan: 0.5c-1g
    databaseName: tms_ciranda
    user: tms_ciranda
    postgresMajorVersion: "17"
    ipAllowList: []
    diskSizeGB: 15
    storageAutoscalingEnabled: true
